<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kathmandu Cultural Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Kathmandu Cultural Events</h1>
  <p class="subtitle">A news aggregator by MAKE Design</p>
  <p class="subscribe-line">
    <a id="subscribe-link" href="events.ics">📅 Subscribe to this calendar</a>
    <span class="subscribe-hint">or add this URL in your calendar app: <code id="subscribe-url">events.ics</code></span>
  </p>
  <nav class="filters" id="filters">
    <button data-filter="upcoming" class="active">Upcoming</button>
    <button data-filter="past">Past</button>
    <button data-filter="all">All</button>
  </nav>
</header>
<main id="events-root">
  <p id="status">Loading events&hellip;</p>
</main>
<footer>
  <p id="generated-at"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
