<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kathmandu Cultural Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Kathmandu Cultural Events</h1>
  <p class="subtitle">Automatically gathered from cultural organizations around Kathmandu.</p>
  <nav class="filters" id="filters">
    <button data-filter="upcoming" class="active">Upcoming</button>
    <button data-filter="past">Past</button>
    <button data-filter="all">All</button>
  </nav>
</header>
<main id="events-root">
  <p id="status">Loading events&hellip;</p>
</main>
<footer>
  <p id="generated-at"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
